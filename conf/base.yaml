# Shared defaults; the selected task YAML supplies dataset and robot settings.

# Motion input and frame range.
start_index: 0  # First frame to process (zero-based, inclusive).
end_index: null  # Stop before this frame; null processes through the last frame.

mocap_src_path: assets/mocap/sample/walk3_subject5.bvh  # Input file or folder of motions.

# Compilation, parallel retargeting, and output.
jit_recompile: true  # Rebuild generated solver code when jit_compile is enabled.
jit_compile: true  # Compile CasADi solver functions to native code.
save_chunks: false  # Save each worker's trajectory as well as the combined result.
enable_stitching: true  # Blend overlapping chunks to smooth their boundaries.
stitch_overlap_frames: 15  # Extra frames on each side of a chunk; also used in refinement.
verbose: false  # Print extra model-loading and solver diagnostics.
n_motion_chunk_workers: 1  # Number of processes solving motion chunks in parallel; Default = 1.
# n_motion_chunk_workers: 10  # Number of processes solving motion chunks in parallel.
use_capsule_constraint: true  # Keep collision capsules above the ground.

# Optional refinement re-solves regions with unusually large velocity or acceleration.
enable_refine: true  # Run refinement after joining chunks; skipped with one motion chunk worker.
refine_spike_threshold: 5  # Flag magnitudes above mean + this many standard deviations.
refine_boost_frames: 5  # Frames at the start of each refinement region given extra iterations.
refine_boost_mult: 5  # Multiply SQP iterations for those initial refinement frames.
refine_pool_workers: null  # Number of refinement processes; null uses all CPUs.
refine_save_plot: true  # Save a before/after diagnostic plot when refinement runs.

# Optional experiment logging to Weights & Biases.
wandb:
  enable: false  # Upload run settings and saved trajectories when true.
  entity: null  # Account or team; null uses the account's default entity.
  project: mocap_retargeting  # Project name; task presets can override it.

# Tracking costs and extra solver iterations at the start of each chunk.
optimizer:
  smoothing_weight: 10  # Penalize pose changes from the previous solved frame.
  tracking_default_weight: 1000  # Tracking weight when a mapping has no explicit weight.
  sqp_boost: 100  # Multiply SQP iterations during warmup and initial chunk frames.
  sqp_boost_frames: 20  # Initial frames per chunk that receive the iteration boost.

# Sequential quadratic programming (SQP) settings used by the retargeting solver.
sqp:
  max_sqp_iter: 1  # Maximum SQP steps per frame before any iteration boost.
  tol: 1e-2  # Stop when the norm of the proposed pose update falls below this value.
  mu_init: 10.0  # Initial constraint-violation penalty for line search.
  mu_multiplier: 1.1  # Scale the dual-variable estimate when updating that penalty.
  tau: 0.5  # Multiply the step size by this factor after a rejected line-search step.
  c1: 1e-4  # Required decrease factor for accepting a line-search step.
  max_ls_iter: 10  # Maximum line-search attempts per SQP step.
  use_line_search: True  # Reduce the step size until the merit function decreases enough.

  # Quadratic-program solver used inside each SQP step.
  qp_solver:
    type: osqp  # OSQP is the supported quadratic-program solver.
    osqp:
      alpha: 1.6  # Relaxation factor for OSQP updates.
      eps_abs: 1e-5  # Absolute convergence tolerance.
      eps_rel: 1e-5  # Relative convergence tolerance.
      eps_prim_inf: 1e-4  # Tolerance for detecting primal infeasibility.
      eps_dual_inf: 1e-4  # Tolerance for detecting dual infeasibility.
      rho: 0.1  # Penalty controlling the balance of primal and dual residuals.
      sigma: 1e-6  # Regularization used in the primal update.
      scaling: 10  # Number of problem-scaling iterations; 0 disables scaling.
      max_iter: 100  # Maximum OSQP iterations per quadratic program.
      time_limit: 0.01  # Time limit in seconds per quadratic program.
      adaptive_rho_interval: 0  # Rho-update interval; 0 chooses automatically if enabled.
      check_termination: 25  # Check convergence every this many OSQP iterations.
      adaptive_rho: false  # Automatically adjust rho during the solve.
      warm_starting: true  # Reuse the previous quadratic-program solution.
      verbose: false  # Print OSQP progress.
