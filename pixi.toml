[workspace]
authors = ["dmarew <dmarew@umass.edu>"]
channels = ["conda-forge"]
description = "Mocap to Robot retargeting tools"
name = "mocap_retargeting"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
pinocchio = ">=3.8.0,<4"
pyyaml = ">=6.0.3,<7"
mujoco = ">=3.3.6,<4"
hydra-core = ">=1.3.2,<2"
omegaconf = ">=2.3.0,<3"
pip = ">=25.3,<26"
ty = ">=0.0.7,<0.0.8"
tqdm = ">=4.67.1,<5"
wandb = ">=0.23.1,<0.24"
flatbuffers = ">=25.12.19,<26"
beautifulsoup4 = ">=4.14.3,<5"
matplotlib = ">=3.10.8,<4"

[pypi-dependencies]
mocap_retargeting = { path = ".", editable = true }
viser = "==1.0.16"
torch = ">=2.0.0"
osqp = ">=1.0.5, <2"
qpax = ">=0.0.9, <0.0.10"
smplx = ">=0.1.28, <0.2"
jax = ">=0.4.20"
pytest = ">=9.0.2, <10"

[target.linux-64.dependencies]
mujoco = ">=3.3.7,<4"

[target.linux-64.pypi-dependencies]
jax = { version = ">=0.4.20", extras = ["cuda12"] }
mujoco-warp = ">=0.0.2"

[feature.amass.dependencies]
python = ">=3.10,<3.11"
numpy = ">=1.22,<1.24"
pip = ">=23.0"

[feature.amass.pypi-dependencies]
smplx = ">=0.1.28, <0.2"
torch = ">=2.0.0"

[environments]
default = []
amass = ["amass"]
